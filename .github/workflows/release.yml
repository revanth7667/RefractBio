name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify tag matches package.json version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Error: Tag $TAG_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
          echo "Tag $TAG_NAME matches package.json version v$PKG_VERSION"

      - name: Verify tag commit is reachable from main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is not on main; refusing to release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Secret scan
        run: npm run secret-scan

      - name: Build
        run: npm run build

      - name: Build single-file
        run: npm run build:single

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Prepare release assets
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_FILE="RefractBio-${PKG_VERSION}.html"
          CHECKSUM_FILE="${RELEASE_FILE}.sha256"
          cp dist-single/index.html "$RELEASE_FILE"
          shasum -a 256 "$RELEASE_FILE" > "$CHECKSUM_FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_FILE="RefractBio-${PKG_VERSION}.html"
          CHECKSUM_FILE="${RELEASE_FILE}.sha256"
          gh release create "${GITHUB_REF_NAME}" "$RELEASE_FILE" "$CHECKSUM_FILE" \
            --title "RefractBio v${PKG_VERSION}" \
            --generate-notes

