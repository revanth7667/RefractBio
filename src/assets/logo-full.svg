<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background tile for dual theme visibility -->
    <linearGradient id="tileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D" />
      <stop offset="100%" stop-color="#0E1117" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.4" />
    </linearGradient>

    <!-- Sheet of paper gradients -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="paperFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Incoming beam (Master Info truth ray) -->
    <linearGradient id="sourceBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0" />
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Prism face gradients (centered at x=120, y: 74 to 174) -->
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="prismRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="prismBottom" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- 5 Refracted output beams - all using userSpaceOnUse starting at origin (120, 140.7) -->
    <!-- 1. Resume (Cyan/Blue) -->
    <linearGradient id="rayResume" gradientUnits="userSpaceOnUse" x1="120" y1="140.7" x2="214" y2="74">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 2. Cover Letter (Emerald / Teal) -->
    <linearGradient id="rayCover" gradientUnits="userSpaceOnUse" x1="120" y1="140.7" x2="220" y2="107">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 3. LinkedIn (Indigo / Violet) -->
    <linearGradient id="rayLinkedIn" gradientUnits="userSpaceOnUse" x1="120" y1="140.7" x2="222" y2="140.7">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#A5B4FC" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- 4. Email (Amber / Orange) -->
    <linearGradient id="rayEmail" gradientUnits="userSpaceOnUse" x1="120" y1="140.7" x2="220" y2="174">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 5. Answers (Fuchsia / Rose) -->
    <linearGradient id="rayAnswers" gradientUnits="userSpaceOnUse" x1="120" y1="140.7" x2="214" y2="207">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Soft dispersion glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Tile Base -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#tileGradient)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderGradient)" stroke-width="2" />

  <!-- Core Ambient Glow centered on prism origin (120, 140.7) -->
  <circle cx="120" cy="140.7" r="46" fill="#38BDF8" opacity="0.14" filter="url(#glow)" />

  <!-- ==================== SHEET OF PAPER (Master Info) ==================== -->
  <g id="document-sheet">
    <!-- Paper base with dog-eared top-right corner -->
    <path d="M 64 88
             L 106 88
             L 120 102
             L 120 174
             L 64 174
             Z" fill="url(#paperGrad)" stroke="#94A3B8" stroke-width="1.75" stroke-linejoin="round" stroke-opacity="0.8" />

    <!-- Folded Corner Flap -->
    <path d="M 106 88
             L 106 102
             L 120 102
             Z" fill="url(#paperFoldGrad)" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.85" />

    <!-- Document Text Lines -->
    <line x1="74" y1="106" x2="98" y2="106" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.55" />
    <line x1="74" y1="117" x2="110" y2="117" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round" opacity="0.45" />
    <line x1="74" y1="128" x2="106" y2="128" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round" opacity="0.45" />
    <line x1="74" y1="152" x2="104" y2="152" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round" opacity="0.35" />
    <line x1="74" y1="162" x2="94" y2="162" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- ==================== INCOMING TRUTH BEAM ==================== -->
  <!-- Enters and reaches directly to the focal center point (120, 140.7) -->
  <line x1="28" y1="140.7" x2="120" y2="140.7" stroke="url(#sourceBeam)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="48" y1="140.7" x2="120" y2="140.7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- ==================== 5 REFRACTED RAYS ==================== -->
  <!-- All originate directly from the center point (120, 140.7) -->

  <!-- 1. Resume (Cyan) -->
  <line x1="120" y1="140.7" x2="214" y2="74" stroke="url(#rayResume)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="214" cy="74" r="3" fill="#38BDF8" />

  <!-- 2. Cover Letter (Teal) -->
  <line x1="120" y1="140.7" x2="220" y2="107" stroke="url(#rayCover)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="220" cy="107" r="3" fill="#34D399" />

  <!-- 3. LinkedIn (Indigo) -->
  <line x1="120" y1="140.7" x2="222" y2="140.7" stroke="url(#rayLinkedIn)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="222" cy="140.7" r="3" fill="#818CF8" />

  <!-- 4. Email (Amber) -->
  <line x1="120" y1="140.7" x2="220" y2="174" stroke="url(#rayEmail)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="220" cy="174" r="3" fill="#FBBF24" />

  <!-- 5. Answers (Rose) -->
  <line x1="120" y1="140.7" x2="214" y2="207" stroke="url(#rayAnswers)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="214" cy="207" r="3" fill="#F472B6" />

  <!-- ==================== PRISM ==================== -->
  <!-- Translucent prism layers rendered over the light intersection -->
  <polygon points="120,74 149,174 91,174" fill="url(#prismBottom)" />
  <polygon points="120,74 120,174 91,174" fill="url(#prismLeft)" />
  <polygon points="120,74 149,174 120,174" fill="url(#prismRight)" />

  <!-- Facet Contours & Highlights -->
  <polygon points="120,74 149,174 91,174" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round" opacity="0.9" />
  <line x1="120" y1="74" x2="120" y2="174" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />

  <!-- Refraction Center Focal Spark (where incoming & all outputs meet) -->
  <circle cx="120" cy="140.7" r="5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="120" cy="140.7" r="3" fill="#FFFFFF" />
</svg>